baseURL = "https://iizz0op.github.io/blog/"
locale = "zh-cn"
defaultContentLanguage = "zh"
title = "iizz0op's Blog"
theme = "hugo-theme-stack"
hasCJKLanguage = true

[pagination]
pagerSize = 8

[permalinks]
post = "/p/:slug/"
page = "/:slug/"

[params]
mainSections = ["post"]
rssFullContent = true

[params.sidebar]
emoji = "✍️"
subtitle = "记录学习、技术与生活"

[params.article]
toc = true
readingTime = true

[params.article.license]
enabled = true
default = "Licensed under CC BY-NC-SA 4.0"

[params.comments]
enabled = false

[params.widgets]
homepage = [
    { type = "search" },
    { type = "archives", params = { limit = 5 } },
    { type = "categories", params = { limit = 10 } },
    { type = "tag-cloud", params = { limit = 10 } },
]
page = [{ type = "toc" }]

[[menu.social]]
identifier = "github"
name = "GitHub"
url = "https://github.com/iizz0op"

[menu.social.params]
icon = "brand-github"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false
codeFences = true
guessSyntax = true
lineNos = true

[markup.tableOfContents]
startLevel = 2
endLevel = 4
ordered = true
